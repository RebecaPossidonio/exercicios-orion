version: '3.8'

services:
  api:
    build: .
    container_name: api_exercicio2
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=senha123
      - DB_NAME=orion_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: db_exercicio2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha123
      - POSTGRES_DB=orion_db
    volumes:
      - dados_banco:/var/lib/postgresql/data

volumes:
  dados_banco:
