version: '3.8'

services:
  api:
    build: .
    container_name: api_exercicio2
    # Variáveis de ambiente exigidas para se conectar ao banco
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=senha123
    # Garante que a API só inicia depois do banco estar pronto
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: db_exercicio2
    # Configurações obrigatórias da imagem oficial do Postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha123
      - POSTGRES_DB=orion_db
    # Configura a persistência de dados (volume nomeado)
    volumes:
      - dados_banco:/var/lib/postgresql/data

volumes:
  dados_banco:
