version: '3.8'

services:
  api:
    # Reconstrói a imagem caso o código mude
    build: 
      context: ../exercicio-2
      dockerfile: Dockerfile
    container_name: api_exercicio3_dev
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=senha123
      - DB_NAME=orion_db
      - AMBIENTE=desenvolvimento
    # MAPEAMENTO DE VOLUME: Conecta o código local com o container para Live Reload
    volumes:
      - ../exercicio-2:/app
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: db_exercicio3_dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha123
      - POSTGRES_DB=orion_db
    volumes:
      - dados_banco_dev:/var/lib/postgresql/data

volumes:
  dados_banco_dev:
