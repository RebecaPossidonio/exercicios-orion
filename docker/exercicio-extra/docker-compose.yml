version: '3.8'

services:
  api:
    # Constrói a imagem real da API que se conecta ao banco de dados de verdade
    build: 
      context: ../exercicio-2
      dockerfile: Dockerfile
    container_name: api_desafio_extra
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=senha_secreta
      - DB_NAME=orion_extra_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: db_desafio_extra
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha_secreta
      - POSTGRES_DB=orion_extra_db
    volumes:
      - dados_extra:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orion_extra_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: painel_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  dados_extra:
